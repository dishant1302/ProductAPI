version: '3.8'

services:

  # ── SQL Server ───────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: productapi_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourPassword123!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourPassword123!' -Q 'SELECT 1' -No -C || exit 1"]
      interval: 10s
      retries: 10
      start_period: 20s
      timeout: 5s

  # ── API ──────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: src/API/Dockerfile
    container_name: productapi_api
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=localhost;Database=ProductAPI;Integrated Security=true;TrustServerCertificate=true"
      JwtSettings__SecretKey: "REPLACE_WITH_A_LONG_RANDOM_SECRET_KEY_MIN_32_CHARS!!"
      JwtSettings__Issuer: "ProductAPI"
      JwtSettings__Audience: "ProductAPI"
      JwtSettings__AccessTokenExpirationMinutes: "15"
      JwtSettings__RefreshTokenExpirationDays: "7"
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - api_logs:/app/logs

volumes:
  sqlserver_data:
  api_logs: